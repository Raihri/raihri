<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-label="Raima Hridika: pink diamonds, champagne gold and animated starlight">
<defs>
<linearGradient id="bg" x2="1" y2="1"><stop stop-color="#210c23"/><stop offset=".5" stop-color="#521536"/><stop offset="1" stop-color="#230c28"/></linearGradient>
<linearGradient id="gold"><stop stop-color="#a86d46"/><stop offset=".35" stop-color="#ffe9bb"/><stop offset=".6" stop-color="#c78d65"/><stop offset="1" stop-color="#fff0cb"/></linearGradient>
<linearGradient id="pink" x2=".7" y2="1"><stop stop-color="#fff0fa"/><stop offset=".4" stop-color="#ff8aca"/><stop offset="1" stop-color="#b21b6a"/></linearGradient>
<radialGradient id="halo"><stop stop-color="#ff7bbd" stop-opacity=".22"/><stop offset="1" stop-color="#ff7bbd" stop-opacity="0"/></radialGradient>
<g id="gem"><polygon points="-65,-20 -35,-52 35,-52 65,-20 0,65" fill="url(#pink)" stroke="#ffd5eb" stroke-width="1"/><path d="M-65-20H65M-35-52-20-20 0 65 20-20 35-52M-35-52 0-20 35-52M-20-20 0-52 20-20" fill="none" stroke="#fff1fa" stroke-opacity=".65" stroke-width="1.3"/><polygon points="-65,-20 -20,-20 0,65" fill="#f75baf" opacity=".5"/><polygon points="20,-20 65,-20 0,65" fill="#9c1656" opacity=".42"/><polygon points="-35,-52 0,-52 -20,-20" fill="#fff" opacity=".55"/></g>
<g id="star" fill="#fff0cf"><path d="M0-10 2-2 10 0 2 2 0 10-2 2-10 0-2-2Z"/></g>
</defs>
<rect width="1200" height="420" rx="16" fill="url(#bg)"/>
<ellipse cx="600" cy="220" rx="590" ry="230" fill="url(#halo)"/>
<rect x="17" y="17" width="1166" height="386" rx="9" fill="none" stroke="url(#gold)" stroke-opacity=".8"/>
<rect x="25" y="25" width="1150" height="370" rx="6" fill="none" stroke="#e7b9bb" stroke-opacity=".18"/>
<path d="M390 76H558L600 55 642 76H810M390 344H558L600 365 642 344H810" fill="none" stroke="url(#gold)"/>
<g transform="translate(155 210) rotate(-12)"><use href="#gem"/><animateTransform attributeName="transform" type="translate" values="0 0;0 -9;0 0" dur="6s" repeatCount="indefinite" additive="sum"/></g>
<g transform="translate(1040 210) rotate(12)"><use href="#gem"/><animateTransform attributeName="transform" type="rotate" values="0;5;0" dur="7s" repeatCount="indefinite" additive="sum"/></g>
<text x="600" y="124" text-anchor="middle" fill="#edbfcc" font-family="Georgia,serif" font-size="15" letter-spacing="7">THE CODING ATELIER</text>
<text x="600" y="216" text-anchor="middle" fill="url(#gold)" font-family="Georgia,serif" font-size="67" font-style="italic">Raima Hridika</text>
<text x="600" y="261" text-anchor="middle" fill="#ffcee6" font-family="Arial,sans-serif" font-size="14" letter-spacing="5">DREAM IN PINK. BUILD WITH PURPOSE.</text>
<text x="600" y="307" text-anchor="middle" fill="#d7a9bd" font-family="Arial,sans-serif" font-size="12" letter-spacing="3">CSE · UNIVERSITY OF DHAKA</text>
<g transform="translate(280 112)"><use href="#star"/><animate attributeName="opacity" values=".15;1;.15" dur="3s" repeatCount="indefinite"/></g>
<g transform="translate(915 305)"><use href="#star"/><animate attributeName="opacity" values="1;.15;1" dur="3.5s" repeatCount="indefinite"/></g>
<g transform="translate(100 100) scale(.6)"><use href="#star"/><animate attributeName="opacity" values=".1;1;.1" dur="4s" repeatCount="indefinite"/></g>
<g transform="translate(1090 100) scale(.7)"><use href="#star"/><animate attributeName="opacity" values="1;.1;1" dur="2.7s" repeatCount="indefinite"/></g>
<g transform="translate(290 320) scale(.5)"><use href="#star"/><animate attributeName="opacity" values=".1;1;.1" dur="2.5s" repeatCount="indefinite"/></g>
<g transform="translate(920 95) scale(.5)"><use href="#star"/><animate attributeName="opacity" values=".1;1;.1" dur="4.5s" repeatCount="indefinite"/></g>
</svg>
